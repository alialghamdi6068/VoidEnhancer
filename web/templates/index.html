<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidEnhancer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">VOID<span>ENHANCER</span></div>
      <h1>Make every frame clearer.</h1>
      <p>AI-powered video enhancement with resolution recovery, cleanup and optional frame interpolation.</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button class="tab active" data-tab="upload">Upload video</button>
        <button class="tab" data-tab="url">Video URL</button>
      </div>

      <div id="upload-panel" class="panel active">
        <label class="drop" for="video">
          <span class="drop-title">Choose a video</span>
          <span class="drop-sub">MP4, MOV, MKV, WEBM, AVI or M4V · up to 8 GB</span>
          <input id="video" type="file" accept="video/*">
        </label>
        <div id="file-name" class="selection">No video selected</div>
      </div>

      <div id="url-panel" class="panel">
        <input id="video-url" class="url-input" type="url" placeholder="https://example.com/video" autocomplete="off">
        <p class="hint">Use a public video URL supported by the server downloader.</p>
      </div>

      <div class="settings">
        <label>Output quality
          <select id="scale"><option value="2">2×</option><option value="4" selected>4×</option></select>
        </label>
        <label><input id="denoise" type="checkbox" checked> Denoise</label>
        <label><input id="deblock" type="checkbox" checked> Compression cleanup</label>
        <label><input id="sharpen" type="checkbox" checked> Smart sharpen</label>
        <label><input id="color" type="checkbox" checked> Color recovery</label>
      </div>

      <button id="enhance" class="primary">Enhance video</button>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-head"><span id="status">Preparing…</span><span id="percent">0%</span></div>
        <div class="progress"><div id="bar"></div></div>
      </div>
      <a id="download" class="download hidden" href="#">Download enhanced video</a>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let mode = 'upload';
let timer = null;

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  mode = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tab));
  $('upload-panel').classList.toggle('active', mode === 'upload');
  $('url-panel').classList.toggle('active', mode === 'url');
}));

$('video').addEventListener('change', () => {
  $('file-name').textContent = $('video').files[0]?.name || 'No video selected';
});

async function watch(jobId) {
  clearTimeout(timer);
  const response = await fetch(`/api/jobs/${jobId}`);
  const job = await response.json();
  if (!response.ok) throw new Error(job.detail || 'Job not found.');
  $('progress-wrap').classList.remove('hidden');
  $('bar').style.width = `${job.progress || 0}%`;
  $('percent').textContent = `${job.progress || 0}%`;
  $('status').textContent = job.message || job.status;
  if (job.status === 'completed') {
    $('download').href = job.download_url;
    $('download').classList.remove('hidden');
    $('enhance').disabled = false;
    return;
  }
  if (job.status === 'failed') throw new Error(job.message || 'Enhancement failed.');
  timer = setTimeout(() => watch(jobId).catch(showError), 1500);
}

function showError(error) {
  $('status').textContent = error.message || 'Something went wrong.';
  $('enhance').disabled = false;
}

function settings() {
  return {
    denoise: $('denoise').checked,
    deblock: $('deblock').checked,
    sharpen: $('sharpen').checked,
    color: $('color').checked,
  };
}

$('enhance').addEventListener('click', async () => {
  $('enhance').disabled = true;
  $('download').classList.add('hidden');
  $('progress-wrap').classList.remove('hidden');
  $('status').textContent = 'Uploading…'; $('percent').textContent = '0%'; $('bar').style.width = '0%';
  try {
    let response;
    const scale = Number($('scale').value);
    const options = settings();
    if (mode === 'upload') {
      if (!$('video').files.length) throw new Error('Choose a video first.');
      const form = new FormData();
      form.append('file', $('video').files[0]);
      response = await fetch(`/api/enhance?scale=${scale}&denoise=${options.denoise}&deblock=${options.deblock}&sharpen=${options.sharpen}&color=${options.color}`, {method:'POST', body:form});
    } else {
      const url = $('video-url').value.trim();
      if (!url) throw new Error('Enter a video URL first.');
      response = await fetch('/api/enhance/url', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url, scale, ...options})
      });
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || 'Could not create the job.');
    await watch(data.job_id);
  } catch (error) { showError(error); }
});
</script>
</body>
</html>
